name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: 1.26.5
  WAILS_VERSION: v3.0.0-beta.28
  PNPM_VERSION: 12
  NODE_VERSION: 24

  GOLANGCI_VERSION: v2.14

  action_setup_deps: ./.github/actions/setup-deps

jobs:
  # check errors,could build
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Deps
        uses: ./.github/actions/setup-deps
        with:
          go-version: ${{env.GO_VERSION}}
          wails-version: ${{env.WAILS_VERSION}}
          pnpm-version: ${{env.PNPM_VERSION}}
          node-version: ${{env.NODE_VERSION}}

      - name: piegon-gui build
        if: ${{!cancelled()}}
        working-directory: cmd/pg-gui
        run: task build

      - name: go mod tidy
        if: ${{ !cancelled() }}
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: golangci-lint
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        continue-on-error: true
        with:
          version: ${{env.GOLANGCI_VERSION}}
      - name: go test
        if: ${{ !cancelled() }}
        run: go test ./...
      - name: CLI go build
        if: ${{ !cancelled() }}
        working-directory: cmd/pigeon
        run: go build

  package:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: macos-latest
            goos: darwin
          - os: windows-latest
            goos: windows

    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7

      - name: Install Deps
        uses: ./.github/actions/setup-deps
        with:
          go-version: ${{env.GO_VERSION}}
          wails-version: ${{env.WAILS_VERSION}}
          pnpm-version: ${{env.PNPM_VERSION}}
          node-version: ${{env.NODE_VERSION}}

      - name: Build
        working-directory: cmd/pg-gui
        run: task build

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: pigeon-${{matrix.goos}}
          path: cmd/pg-gui/bin
