name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: 1.26.5
  WAILS_VERSION: v3.0.0-beta.28
  PNPM_VERSION: 12
  NODE_VERSION: 24

  GOLANGCI_VERSION: v2.14

  action_setup_deps: ./.github/actions/setup-deps

jobs:
  # check errors,could build
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Deps
        uses: ./.github/actions/setup-deps
        with:
          go-version: ${{env.GO_VERSION}}
          wails-version: ${{env.WAILS_VERSION}}
          pnpm-version: ${{env.PNPM_VERSION}}
          node-version: ${{env.NODE_VERSION}}

      - name: piegon-gui build
        if: ${{!cancelled()}}
        working-directory: cmd/pg-gui
        run: task build

      - name: go mod tidy
        if: ${{ !cancelled() }}
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: golangci-lint
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        continue-on-error: true
        with:
          version: ${{env.GOLANGCI_VERSION}}
      - name: go test
        if: ${{ !cancelled() }}
        run: go test ./...
      - name: CLI go build
        if: ${{ !cancelled() }}
        working-directory: cmd/pigeon
        run: go build

  package:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: macos-26
            goos: darwin
          - os: windows-latest
            goos: windows

    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        if: matrix.goos == 'windows'
        shell: bash
        run: choco install yq -y --no-progress

      - name: Extract package name
        id: pkg
        working-directory: cmd/pg-gui/build
        shell: bash
        run: |
          BASE=$(yq '.info.productName' config.yml)
          [ -z "$BASE" ] || [ "$BASE" = "null" ] && { echo "product name not found"; exit 1; }
          echo "name=${BASE}-${{matrix.goos}}" >> "$GITHUB_OUTPUT"

      - name: Install Deps
        uses: ./.github/actions/setup-deps
        with:
          go-version: ${{env.GO_VERSION}}
          wails-version: ${{env.WAILS_VERSION}}
          pnpm-version: ${{env.PNPM_VERSION}}
          node-version: ${{env.NODE_VERSION}}

      - name: Build
        working-directory: cmd/pg-gui
        run: task build

      - name: Archive binary
        working-directory: cmd/pg-gui/bin
        shell: bash
        run: |
          tar -czf ../${{steps.pkg.outputs.name}}.tar.gz .
          if [ "${{ matrix.goos }}" == "windows" ]; then
            7z a ../${{steps.pkg.outputs.name}}.zip . > /dev/null
            7z a ../${{steps.pkg.outputs.name}}.7z . > /dev/null
          else
            zip -r ../${{steps.pkg.outputs.name}}.zip . > /dev/null
          fi
          mv ../${{steps.pkg.outputs.name}}.* .

      - name: Package
        working-directory: cmd/pg-gui
        run: task package

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.pkg.outputs.name}}
          path: cmd/pg-gui/bin

  pre-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: ver
        working-directory: cmd/pg-gui/build
        run: |
          BASE=$(yq '.info.version' config.yml)
          [ -z "$BASE" ] || [ "$BASE" = "null" ] && { echo "version not found"; exit 1; }
          echo "tag=v${BASE}-dev.$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{steps.ver.outputs.tag}}
          name: ${{steps.ver.outputs.tag}}
          prerelease: true
          generate_release_notes: true
          files: artifacts/**/*
