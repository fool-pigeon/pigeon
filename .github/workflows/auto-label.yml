name: Auto Label by Title Prefix
on:
  pull_request:
    types: [opened, edited]
  issues:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const rules = {
              feat: 'feat',
              fix: 'fix',
              chore: 'chore',
              ci: 'ci',
              docs: 'documentation',
              refactor: 'refactor',
              perf: 'performance'
            };
            const payload = context.payload.issue || context.payload.pull_request;
            const m = payload.title.match(/^([a-z]+)(?:\([^)]*\))?(!)?:/i);
            if (!m) return;
            const labels = [];
            const mapped = rules[m[1].toLowerCase()];
            if (mapped) labels.push(mapped);
            if (m[2]) labels.push('breaking change');
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: payload.number,
                labels
              });
            }
