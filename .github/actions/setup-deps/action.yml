name: "Setup Dependents"
description: "Install go,wails3 CLI,pnpm,node"

inputs:
  go-version:
    required: true
    description: "go toolchain version,need sync to go.mod"
  wails-version:
    required: true
  pnpm-version:
    required: true
  node-version:
    required: true

runs:
  # For more on composite actions, see:
  # https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action
  using: composite
  steps:
    # Install Go
    - name: Cache go toolchain
      id: go-cache-toolchain
      # Windows has the problem with symlink
      if: runner.os!='Windows'
      uses: actions/cache@v6
      with:
        path: ${{runner.tool_cache}}/go/${{inputs.go-version}}
        key: go-cache-toolchain-${{runner.os}}-${{inputs.go-version}}
    - name: Install go
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
        check-latest: false
        token: ${{ github.token }}
        cache: true
        cache-dependency-path: "go.sum"
    # Install Linux's deps for wails3
    - name: Apt-get update on linux
      if: runner.os=='Linux'
      shell: bash
      run: sudo apt-get update -qq
    - name: Install system deps and cached on linux
      if: runner.os=='Linux'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
        version: 1.0
    # Install wails3 CLI & task
    - name: Cache wails3 CLI
      id: wails3-cache-cli
      uses: actions/cache@v6
      with:
        path: ~/go/bin/wails3*
        key: wails3@${{inputs.wails-version}}-${{runner.os}}
    - name: Install wails3 CLI
      if: steps.wails3-cache-cli.outputs.cache-hit!='true'
      shell: bash
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{inputs.wails-version}}
    - name: Install Task
      uses: arduino/setup-task@v3
      with:
        repo-token: ${{github.token}}
    # Install pnpm & node
    - name: Install pnpm & node
      uses: pnpm/setup@v1
      with:
        version: ${{inputs.pnpm-version}}
        runtime: node@${{inputs.node-version}}
        cache: true
        package-json-file: cmd/pg-gui/frontend/package.json
        cache-dependency-path: cmd/pg-gui/frontend/pnpm-lock.yaml

    - name: Cache yq on windows
      uses: actions/cache@v6
      id: go-yq-cache
      with:
        path: ~/go/bin/yq*
        key: go-yq-${{runner.os}}
    - name: Install yq on windows
      if: runner.os=='Windows' && steps.go-yq-cache.outputs.cache-hit!='true'
      shell: bash
      run: go install github.com/mikefarah/yq/v4@latest

    - name: Install NSIS on windows
      if: runner.os=='Windows'
      uses: nsis-dev/setup-nsis@v1.2.1
