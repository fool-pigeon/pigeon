name: Bug Report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Fill in all required fields.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: Tell us exactly what you see.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Run `...`
        2. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you using?
      placeholder: e.g. v0.0.1
    validations:
      required: true
      
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: os-info
    attributes:
      label: OS-info
      placeholder: Paste your operating system information here
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste terminal output or stack traces.
      render: shell

  - type: textarea
    id: other
    attributes:
      label: more-info
      placeholder: You can tell us more about bug if you could